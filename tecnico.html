<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ConTecAd — Cierre de Ticket</title>
<style>
:root{
  --accent:#2563eb;--green:#16a34a;--red:#dc2626;--warn:#d97706;
  --bg:#f8fafc;--card:#ffffff;--border:#e2e8f0;
  --text:#0f172a;--muted:#64748b;--mono:'Consolas','Courier New',monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
.hdr{background:#1e3a5f;color:#fff;padding:14px 20px;}
.hdr h1{font-size:17px;font-weight:700;}
.hdr p{font-size:12px;opacity:.7;margin-top:2px;}
.main{max-width:600px;margin:0 auto;padding:20px 16px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.08);}
.badge{display:inline-block;padding:3px 10px;border-radius:10px;font-size:11px;font-weight:600;}
.alta{background:#fef2f2;color:#b91c1c;border:1px solid #fca5a5;}
.media{background:#fffbeb;color:#92400e;border:1px solid #fcd34d;}
.baja{background:#f0fdf4;color:#15803d;border:1px solid #86efac;}
.field{background:var(--bg);border-radius:8px;padding:11px 13px;margin-bottom:10px;font-size:13px;}
.field strong{font-size:10px;text-transform:uppercase;color:var(--muted);letter-spacing:.4px;display:block;margin-bottom:3px;}
label{display:block;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px;margin-top:16px;}
textarea,input[type=text]{width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:8px;font-size:15px;font-family:inherit;background:var(--card);color:var(--text);}
textarea{resize:vertical;min-height:100px;}
textarea:focus,input:focus{outline:none;border-color:var(--accent);}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px 20px;border-radius:9px;border:none;font-size:15px;font-weight:700;cursor:pointer;width:100%;margin-top:12px;font-family:inherit;}
.btn-green{background:var(--green);color:#fff;}
.btn-blue{background:var(--accent);color:#fff;}
.btn-gray{background:#e2e8f0;color:var(--text);}
.sep{height:1px;background:var(--border);margin:18px 0;}
#canvas-firma{border:1.5px solid var(--border);border-radius:8px;background:#fff;cursor:crosshair;touch-action:none;display:block;width:100%;height:130px;}
.photo-grid{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
.photo-thumb{width:72px;height:72px;object-fit:cover;border-radius:7px;border:1px solid var(--border);}
.maps-btn{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--green);color:#fff;padding:13px;border-radius:9px;text-decoration:none;font-weight:700;font-size:15px;margin-bottom:12px;}
.step{display:flex;align-items:center;gap:10px;padding:12px;background:var(--bg);border-radius:8px;margin-bottom:8px;font-size:13px;}
.step-num{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px;}
</style>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://apis.google.com/js/api.js" async defer></script>
</head>
<body>

<div class="hdr">
  <h1>👷 Cierre de Ticket — ConTecAd</h1>
  <p>Portal del Técnico</p>
</div>

<div class="main" id="main-content">
  <div class="card" style="text-align:center;padding:40px;">
    <div style="font-size:40px;">⏳</div>
    <p style="margin-top:12px;color:var(--muted);">Cargando información del ticket...</p>
  </div>
</div>

<script>

// ══════════════════════════════════════════════════════════════
// GOOGLE DRIVE — Sincronización directa del cierre (incluye fotos/firma)
// ══════════════════════════════════════════════════════════════
const GAPI_CLIENT_ID = '393065960730-k0ucj6v7c9rl4es8kksavp0jjo5jqpe5.apps.googleusercontent.com';
const GAPI_SCOPES    = 'https://www.googleapis.com/auth/drive.appdata https://www.googleapis.com/auth/drive.file';
const DRIVE_FILENAME = 'contecad_helpdesk_backup.json';
const DRIVE_FOLDER   = 'appDataFolder';

let driveAccessToken = null;
let driveFileId      = null;
let driveTokenClient = null;
let driveReady       = false;

function driveInit(cb){
  if(!window.gapi || !window.google?.accounts?.oauth2){ setTimeout(()=>driveInit(cb), 400); return; }
  gapi.load('client', async ()=>{
    await gapi.client.init({});
    await gapi.client.load('https://www.googleapis.com/discovery/v1/apis/drive/v3/rest');
    driveReady = true;
    if(cb) cb();
  });
  driveTokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GAPI_CLIENT_ID,
    scope: GAPI_SCOPES,
    callback: (resp)=>{
      if(resp.error){ mostrarEstadoEnvio('⚠ Error al conectar con Google: '+resp.error, true); return; }
      driveAccessToken = resp.access_token;
      gapi.client.setToken({access_token: driveAccessToken});
      sessionStorage.setItem('ctcad_tec_drive_token', driveAccessToken);
      procederConCierre();
    }
  });
}

function driveConnectAndClose(){
  if(!driveTokenClient){
    mostrarEstadoEnvio('Cargando Google...', false);
    driveInit(()=>driveTokenClient.requestAccessToken({prompt:'consent'}));
    return;
  }
  driveTokenClient.requestAccessToken({prompt: driveAccessToken ? '' : 'consent'});
}

async function driveFindFile(){
  const r = await gapi.client.drive.files.list({
    spaces: DRIVE_FOLDER, fields: 'files(id,name)', q: "name='"+DRIVE_FILENAME+"'"
  });
  const files = r.result.files;
  if(files && files.length>0) driveFileId = files[0].id;
}

async function driveLoadBackup(){
  await driveFindFile();
  if(!driveFileId) return null;
  const resp = await fetch('https://www.googleapis.com/drive/v3/files/'+driveFileId+'?alt=media',
    {headers:{'Authorization':'Bearer '+driveAccessToken}});
  if(!resp.ok) return null;
  return await resp.json();
}

async function driveSaveBackup(backup){
  const jsonStr = JSON.stringify(backup);
  if(!driveFileId){
    const createResp = await fetch('https://www.googleapis.com/drive/v3/files',{
      method:'POST',
      headers:{'Authorization':'Bearer '+driveAccessToken,'Content-Type':'application/json'},
      body: JSON.stringify({name:DRIVE_FILENAME, parents:[DRIVE_FOLDER]})
    });
    if(!createResp.ok) throw new Error('No se pudo crear archivo: HTTP '+createResp.status);
    const created = await createResp.json();
    driveFileId = created.id;
  }
  const uploadResp = await fetch(
    'https://www.googleapis.com/upload/drive/v3/files/'+driveFileId+'?uploadType=media',
    {method:'PATCH', headers:{'Authorization':'Bearer '+driveAccessToken,'Content-Type':'application/json'}, body: jsonStr}
  );
  if(!uploadResp.ok) throw new Error('Error al subir: HTTP '+uploadResp.status);
}

// ── Comprimir imagen antes de guardar (mantiene el tamaño manejable) ──
function comprimirImagen(file, maxW){
  return new Promise((resolve)=>{
    const img = new Image();
    const reader = new FileReader();
    reader.onload = e=>{
      img.onload = ()=>{
        const scale = Math.min(1, maxW / img.width);
        const w = Math.round(img.width * scale);
        const h = Math.round(img.height * scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.6));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

// ── Decodificar datos del ticket desde el hash de la URL ──────
function getTktData(){
  try{
    const hash = window.location.hash;
    const match = hash.match(/tkt=([^&]+)/);
    if(!match) return null;
    return JSON.parse(decodeURIComponent(escape(atob(match[1]))));
  }catch(e){ return null; }
}

function escH(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function mapsUrl(ll){
  if(!ll)return null;
  const p=ll.replace(/\s/g,'').split(',');
  if(p.length!==2)return null;
  const la=parseFloat(p[0]),lo=parseFloat(p[1]);
  return isNaN(la)||isNaN(lo)?null:'https://www.google.com/maps?q='+la+','+lo;
}
function fmtDT(s){
  if(!s)return'—';
  try{const d=new Date(s);return d.toLocaleDateString('es-HN',{day:'2-digit',month:'2-digit',year:'numeric'})+' '+d.toLocaleTimeString('es-HN',{hour:'2-digit',minute:'2-digit'});}
  catch(e){return s;}
}

// ── Firma canvas ──────────────────────────────────────────────
let _draw=false,_ctx=null,_cv=null;
function initFirma(){
  _cv=document.getElementById('canvas-firma');
  if(!_cv)return;
  _cv.width=_cv.offsetWidth;
  _ctx=_cv.getContext('2d');
  _ctx.strokeStyle='#0f172a';_ctx.lineWidth=2.5;_ctx.lineCap='round';_ctx.lineJoin='round';
  function pos(e){
    const r=_cv.getBoundingClientRect();
    const t=e.touches?e.touches[0]:e;
    return{x:(t.clientX-r.left)*(_cv.width/r.width),y:(t.clientY-r.top)*(_cv.height/r.height)};
  }
  _cv.onmousedown=_cv.ontouchstart=e=>{_draw=true;const p=pos(e);_ctx.beginPath();_ctx.moveTo(p.x,p.y);e.preventDefault();};
  _cv.onmousemove=_cv.ontouchmove=e=>{if(!_draw)return;const p=pos(e);_ctx.lineTo(p.x,p.y);_ctx.stroke();e.preventDefault();};
  _cv.onmouseup=_cv.onmouseleave=_cv.ontouchend=_cv.ontouchcancel=()=>_draw=false;
}
function limpiarFirma(){if(_ctx&&_cv)_ctx.clearRect(0,0,_cv.width,_cv.height);}
function hayFirma(){
  if(!_cv||!_ctx)return false;
  const d=_ctx.getImageData(0,0,_cv.width,_cv.height).data;
  for(let i=3;i<d.length;i+=4){if(d[i]>0)return true;}
  return false;
}
function getFirmaBase64(){
  if(!hayFirma()) return null;
  return _cv.toDataURL('image/png');
}

// ── Preview fotos ─────────────────────────────────────────────
function initFotos(){
  const inp=document.getElementById('tec-fotos');
  if(!inp)return;
  inp.onchange=()=>{
    const prev=document.getElementById('fotos-preview');
    if(!prev)return;
    prev.innerHTML='';
    Array.from(inp.files).slice(0,5).forEach(f=>{
      const r=new FileReader();
      r.onload=e=>{
        const img=document.createElement('img');
        img.src=e.target.result;img.className='photo-thumb';
        prev.appendChild(img);
      };
      r.readAsDataURL(f);
    });
  };
}

// ── Enviar cierre por correo ──────────────────────────────────
function mostrarEstadoEnvio(msg, isErr){
  let el = document.getElementById('envio-status');
  if(!el){
    el = document.createElement('div');
    el.id = 'envio-status';
    el.style.cssText = 'margin-top:12px;padding:12px 14px;border-radius:8px;font-size:13px;font-weight:500;';
    const btn = document.querySelector('.btn-green');
    if(btn) btn.insertAdjacentElement('afterend', el);
  }
  el.textContent = msg;
  el.style.background = isErr ? '#fef2f2' : '#eff6ff';
  el.style.color      = isErr ? '#b91c1c' : '#1d4ed8';
  el.style.border     = isErr ? '1px solid #fca5a5' : '1px solid #bfdbfe';
}

let _tktPendiente = null;

function enviarCierre(tkt){
  const sol = document.getElementById('tec-solucion').value.trim();
  if(!sol){
    alert('Por favor describe la solucion antes de enviar.');
    document.getElementById('tec-solucion').focus();
    return;
  }
  _tktPendiente = tkt;
  mostrarEstadoEnvio('Conectando con Google Drive para sincronizar el cierre...', false);

  const saved = sessionStorage.getItem('ctcad_tec_drive_token');
  if(saved && !driveAccessToken){
    driveAccessToken = saved;
    driveInit(()=>{
      gapi.client.setToken({access_token: driveAccessToken});
      procederConCierre();
    });
  } else if(driveAccessToken){
    procederConCierre();
  } else {
    driveConnectAndClose();
  }
}

async function procederConCierre(){
  const tkt = _tktPendiente;
  if(!tkt) return;
  const sol = document.getElementById('tec-solucion').value.trim();

  try{
    mostrarEstadoEnvio('Sincronizando datos del sistema...', false);
    const backup = await driveLoadBackup();
    if(!backup || !backup.tickets){
      mostrarEstadoEnvio('No se encontraron datos en Drive. El administrador debe conectar Drive al menos una vez desde su computadora.', true);
      return;
    }

    const idx = backup.tickets.findIndex(t=>t.id===tkt.id);
    if(idx<0){
      mostrarEstadoEnvio('Ticket no encontrado en el sistema. Puede que ya fue eliminado.', true);
      return;
    }

    mostrarEstadoEnvio('Procesando fotos y firma...', false);

    const inp = document.getElementById('tec-fotos');
    const fotosBase64 = [];
    if(inp && inp.files.length){
      for(const f of Array.from(inp.files).slice(0,6)){
        const compressed = await comprimirImagen(f, 900);
        fotosBase64.push(compressed);
      }
    }
    const firmaBase64 = getFirmaBase64();

    const ahora = new Date().toISOString();
    backup.tickets[idx].estado       = 'Cerrado';
    backup.tickets[idx].fecha_cierre = ahora;
    backup.tickets[idx].solucion     = sol;
    backup.tickets[idx].fotos        = (backup.tickets[idx].fotos||[]).concat(fotosBase64);
    if(firmaBase64) backup.tickets[idx].firma = firmaBase64;
    if(!backup.tickets[idx].notas) backup.tickets[idx].notas = [];
    backup.tickets[idx].notas.push({
      fecha: ahora,
      texto: 'Cerrado por el tecnico '+tkt.tecnico+' desde el Portal del Tecnico (con '+fotosBase64.length+' foto(s)'+(firmaBase64?' y firma':'')+').',
      tipo: 'estado'
    });

    mostrarEstadoEnvio('Guardando en el sistema...', false);
    await driveSaveBackup(backup);

    mostrarExito(tkt, fotosBase64.length, !!firmaBase64);
  }catch(e){
    console.error('Error en cierre:', e);
    mostrarEstadoEnvio('Error al sincronizar: '+e.message+'. Intenta de nuevo.', true);
  }
}

function mostrarExito(tkt, numFotos, tieneFirma){
  document.getElementById('main-content').innerHTML = '<div class="card" style="text-align:center;padding:40px 24px;">'
    + '<div style="font-size:64px;margin-bottom:14px;">\u2705</div>'
    + '<h2 style="font-size:22px;color:var(--green);margin-bottom:10px;">\u00a1Ticket Cerrado!</h2>'
    + '<p style="color:var(--muted);font-size:14px;margin-bottom:6px;">Ticket: <strong>'+escH(tkt.num)+'</strong></p>'
    + '<p style="color:var(--muted);font-size:14px;margin-bottom:16px;">'+escH(tkt.estacion)+'</p>'
    + '<div style="background:#f0fdf4;border-radius:9px;padding:14px;font-size:13px;color:#15803d;text-align:left;">'
    + 'El ticket fue cerrado y sincronizado directamente en el sistema.<br>'
    + numFotos+' foto(s) guardada(s)'+(tieneFirma?' &middot; Firma guardada':'')
    + '</div>'
    + '<p style="font-size:12px;color:var(--muted);margin-top:16px;">El administrador ya puede ver el reporte completo en el HelpDesk.</p>'
    + '</div>';
}

// ── Renderizar la página con los datos del ticket ─────────────
function render(tkt){
  const url = mapsUrl(tkt.latlon);
  document.getElementById('main-content').innerHTML = `

    <!-- Encabezado del ticket -->
    <div class="card">
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px;">
        <span style="font-family:var(--mono);font-weight:700;color:var(--accent);font-size:15px;">${escH(tkt.num)}</span>
        <span class="badge ${(tkt.prioridad||'').toLowerCase()}">${escH(tkt.prioridad)}</span>
        ${tkt.tipoCaso?`<span style="font-size:12px;background:#eff6ff;color:#1d4ed8;padding:3px 9px;border-radius:8px;border:1px solid #bfdbfe;">${escH(tkt.tipoCaso)}</span>`:''}
      </div>

      <div class="field"><strong>Estación / Sitio</strong>
        ${escH(tkt.estacion)}${tkt.ciudad?', '+escH(tkt.ciudad):''}
        ${tkt.dir?`<div style="font-size:12px;color:var(--muted);margin-top:3px;">📍 ${escH(tkt.dir)}</div>`:''}
      </div>

      ${url?`<a href="${url}" target="_blank" class="maps-btn">📍 Abrir Ubicación en Google Maps</a>`:''}

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
        <div class="field"><strong>Contacto</strong>${escH(tkt.contacto||'—')}</div>
        <div class="field"><strong>Teléfono</strong>
          ${tkt.telefono?`<a href="tel:${escH(tkt.telefono)}" style="color:var(--accent);font-weight:600;">${escH(tkt.telefono)}</a>`:'—'}
        </div>
      </div>

      <div class="field"><strong>Descripción del Problema</strong>${escH(tkt.descripcion)}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
        <div class="field"><strong>Categoría</strong>${escH(tkt.categoria)}</div>
        <div class="field"><strong>Apertura</strong>${fmtDT(tkt.apertura)}</div>
      </div>
    </div>

    <!-- Pasos -->
    <div class="card">
      <div style="font-size:15px;font-weight:700;margin-bottom:14px;">📋 Para cerrar este ticket:</div>
      <div class="step"><div class="step-num">1</div><div>Resuelve el problema en sitio / remotamente</div></div>
      <div class="step"><div class="step-num">2</div><div>Llena el formulario de cierre abajo</div></div>
      <div class="step"><div class="step-num">3</div><div>Presiona <strong>"Cerrar Ticket"</strong> — la primera vez te pedirá conectar tu cuenta de Google una sola vez</div></div>
    </div>

    <!-- Formulario de cierre -->
    <div class="card">
      <div style="font-size:15px;font-weight:700;margin-bottom:4px;">✅ Reporte de Cierre</div>
      <p style="font-size:13px;color:var(--muted);margin-bottom:4px;">Técnico: <strong>${escH(tkt.tecnico)}</strong></p>

      <label>Solución Aplicada <span style="color:var(--red);">*</span></label>
      <textarea id="tec-solucion" rows="5"
        placeholder="Describe detalladamente qué hiciste para resolver el problema..."
        style="touch-action:auto;-webkit-user-select:text;user-select:text;font-size:16px;"></textarea>

      <label style="margin-top:18px;">Fotos del trabajo (opcional)</label>
      <input type="file" id="tec-fotos" accept="image/*" multiple
        style="padding:10px;border:1.5px dashed var(--border);border-radius:8px;background:var(--bg);font-size:13px;width:100%;">
      <p style="font-size:11px;color:var(--muted);margin-top:4px;">Puedes elegir fotos de tu galería o tomar nuevas con la cámara.</p>
      <div class="photo-grid" id="fotos-preview"></div>

      <label style="margin-top:18px;">Firma del Cliente (opcional)</label>
      <p style="font-size:12px;color:var(--muted);margin-bottom:8px;">Pide al cliente que firme aquí con el dedo:</p>
      <canvas id="canvas-firma"></canvas>
      <button class="btn btn-gray" onclick="limpiarFirma()" style="width:auto;padding:8px 18px;margin-top:8px;font-size:13px;border-radius:8px;border:1.5px solid var(--border);cursor:pointer;font-family:inherit;">
        Limpiar firma
      </button>

      <div class="sep"></div>

      <button class="btn btn-green" onclick="enviarCierre(tktData)">
        Cerrar Ticket y Sincronizar
      </button>
      <p style="font-size:11px;color:var(--muted);margin-top:10px;text-align:center;">
        El cierre, fotos y firma se guardan directamente en el sistema.<br>La primera vez te pedirá conectar tu cuenta de Google.
      </p>
    </div>`;

  setTimeout(()=>{initFirma();initFotos();}, 200);
}

// ── Página de error ───────────────────────────────────────────
function renderError(){
  document.getElementById('main-content').innerHTML=`
    <div class="card" style="text-align:center;padding:40px 24px;">
      <div style="font-size:52px;margin-bottom:14px;">⚠️</div>
      <h2 style="font-size:18px;margin-bottom:10px;">Enlace no válido</h2>
      <p style="font-size:14px;color:var(--muted);">Este enlace no contiene datos del ticket o es incorrecto.<br>Por favor usa el enlace del correo que recibiste.</p>
    </div>`;
}

// ── Inicio ────────────────────────────────────────────────────
var tktData = getTktData();
if(tktData){ render(tktData); }
else{ renderError(); }
</script>
</body>
</html>
