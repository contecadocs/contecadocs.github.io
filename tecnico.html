<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ConTecAd — Cierre de Ticket</title>
<style>
:root{
  --accent:#2563eb;--green:#16a34a;--red:#dc2626;--warn:#d97706;
  --bg:#f8fafc;--card:#ffffff;--border:#e2e8f0;
  --text:#0f172a;--muted:#64748b;--mono:'Consolas','Courier New',monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
.hdr{background:#1e3a5f;color:#fff;padding:14px 20px;}
.hdr h1{font-size:17px;font-weight:700;}
.hdr p{font-size:12px;opacity:.7;margin-top:2px;}
.main{max-width:600px;margin:0 auto;padding:20px 16px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.08);}
.badge{display:inline-block;padding:3px 10px;border-radius:10px;font-size:11px;font-weight:600;}
.alta{background:#fef2f2;color:#b91c1c;border:1px solid #fca5a5;}
.media{background:#fffbeb;color:#92400e;border:1px solid #fcd34d;}
.baja{background:#f0fdf4;color:#15803d;border:1px solid #86efac;}
.field{background:var(--bg);border-radius:8px;padding:11px 13px;margin-bottom:10px;font-size:13px;}
.field strong{font-size:10px;text-transform:uppercase;color:var(--muted);letter-spacing:.4px;display:block;margin-bottom:3px;}
label{display:block;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px;margin-top:16px;}
textarea{width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:8px;font-size:16px;font-family:inherit;background:var(--card);color:var(--text);resize:vertical;min-height:110px;}
textarea:focus{outline:none;border-color:var(--accent);}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:15px 20px;border-radius:9px;border:none;font-size:16px;font-weight:700;cursor:pointer;width:100%;margin-top:14px;font-family:inherit;}
.btn-green{background:var(--green);color:#fff;}
.maps-btn{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--green);color:#fff;padding:13px;border-radius:9px;text-decoration:none;font-weight:700;font-size:15px;margin-bottom:12px;}
.step{display:flex;align-items:center;gap:10px;padding:12px;background:var(--bg);border-radius:8px;margin-bottom:8px;font-size:13px;}
.step-num{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px;}
.doc-acept-banner{background:#fef3c7;border:1.5px solid #f59e0b;border-radius:10px;padding:12px 14px;margin-bottom:14px;font-size:13px;color:#92400e;display:flex;gap:10px;align-items:flex-start;}
.gtable{width:100%;border-collapse:collapse;margin:8px 0;font-size:13px;}
.gtable th{background:#0f172a;color:#fff;padding:7px 8px;font-size:11px;text-align:left;}
.gtable td{padding:6px 8px;border:1px solid var(--border);}
.gtable input{border:none;width:100%;padding:4px;font-size:13px;background:transparent;}
.gtable input:focus{outline:1px solid var(--accent);border-radius:3px;}
.rb-group{display:flex;gap:14px;margin-top:6px;}
.rb-opt{display:flex;align-items:center;gap:5px;font-size:13px;}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>

// ── Decodificar datos del ticket desde el hash de la URL ──────
function getTktData(){
  try{
    const hash = window.location.hash;
    const match = hash.match(/tkt=([^&]+)/);
    if(!match) return null;
    return JSON.parse(decodeURIComponent(escape(atob(match[1]))));
  }catch(e){ return null; }
}

function escH(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function mapsUrl(ll){
  if(!ll)return null;
  const p=ll.replace(/\s/g,'').split(',');
  if(p.length!==2)return null;
  const la=parseFloat(p[0]),lo=parseFloat(p[1]);
  return isNaN(la)||isNaN(lo)?null:'https://www.google.com/maps?q='+la+','+lo;
}
function fmtDT(s){
  if(!s)return'—';
  try{const d=new Date(s);return d.toLocaleDateString('es-HN',{day:'2-digit',month:'2-digit',year:'numeric'})+' '+d.toLocaleTimeString('es-HN',{hour:'2-digit',minute:'2-digit'});}
  catch(e){return s;}
}

// ── Enviar cierre por correo (mailto: — sin login, sin Google) ──
function enviarCierre(tkt){
  const sol = document.getElementById('tec-solucion').value.trim();
  if(!sol){
    alert('Por favor describe la solución antes de enviar.');
    document.getElementById('tec-solucion').focus();
    return;
  }

  // Validación específica del Documento de Aceptación (Puma/Shell)
  if(tkt.requierePumaShell && !hayFirmaDA()){
    alert('Este ticket requiere el Documento de Aceptación firmado por el cliente.\n\nPide al cliente que firme en la sección "Firma del Cliente (Recibí Conforme)" antes de continuar.');
    document.getElementById('canvas-firma-da')?.scrollIntoView({behavior:'smooth',block:'center'});
    return;
  }

  // Generar y descargar el PDF del Documento de Aceptación (si aplica)
  if(tkt.requierePumaShell){
    try{
      const docPDF = generarPDFDocAceptacion(tkt);
      docPDF.save('DocAceptacion_'+(tkt.docAceptacionNum||'SN')+'_'+tkt.num.replace(/[^a-z0-9]/gi,'_')+'.pdf');
    }catch(e){
      console.error('Error generando PDF Documento de Aceptación:', e);
      alert('Hubo un error generando el PDF del Documento de Aceptación. El cierre continuará, pero avisa al administrador.');
    }
  }

  const ahora = new Date().toLocaleString('es-HN');

  const asunto = (tkt.requierePumaShell?'[PUMA/SHELL] ':'') + '[CIERRE] Ticket ' + tkt.num + ' - ' + tkt.estacion;
  // Cuerpo compacto (los mailto: largos fallan silenciosamente en varios apps Android)
  const cuerpo = [
    'CIERRE DE TICKET ' + tkt.num,
    'Tecnico: ' + tkt.tecnico,
    'Fecha: ' + ahora,
    '',
    'Estacion: ' + tkt.estacion + (tkt.ciudad ? ', ' + tkt.ciudad : ''),
    'Categoria: ' + tkt.categoria + ' | Prioridad: ' + tkt.prioridad,
    '',
    'Problema: ' + tkt.descripcion,
    '',
    'Solucion: ' + sol,
    tkt.requierePumaShell ? '\nDocumento de Aceptacion N ' + (tkt.docAceptacionNum||'') + ': se descargo un PDF a este celular. ADJUNTALO manualmente a este correo antes de enviar.' : '',
    '',
    '(Cerrar manualmente en el sistema HelpDesk)'
  ].join('\n');

  const mailto = 'mailto:contecadocs@gmail.com'
    + '?subject=' + encodeURIComponent(asunto)
    + '&body='    + encodeURIComponent(cuerpo);

  setTimeout(function(){ window.location.href = mailto; }, tkt.requierePumaShell ? 900 : 0);

  // Pantalla de confirmación clara — el técnico debe confirmar que YA presionó Enviar
  // (el navegador nunca puede saber si el correo realmente se envió)
  setTimeout(function(){
    document.getElementById('main-content').innerHTML =
      '<div class="card" style="text-align:center;padding:32px 24px;">'
      + '<div style="font-size:52px;margin-bottom:10px;">\u270d\ufe0f</div>'
      + '<h2 style="font-size:19px;color:#1d4ed8;margin-bottom:10px;">\u00a1Un paso m\u00e1s!</h2>'
      + (tkt.requierePumaShell ? (
        '<div style="background:#f0fdf4;border:1.5px solid #86efac;border-radius:9px;padding:14px;font-size:13px;color:#15803d;text-align:left;margin-bottom:10px;">'
        + '\u2705 <strong>PDF descargado</strong> a este celular (revisa la carpeta de Descargas).'
        + '</div>'
      ) : '')
      + '<div style="background:#fffbeb;border:1.5px solid #fcd34d;border-radius:9px;padding:16px;font-size:14px;color:#92400e;text-align:left;margin-bottom:16px;">'
      + '<strong>\u26a0\ufe0f Tu app de correo se abri\u00f3</strong>, pero el correo NO se ha enviado todav\u00eda.<br><br>'
      + 'Ve a tu app de correo (Gmail, Outlook, etc.)'
      + (tkt.requierePumaShell ? ', <strong>adjunta el PDF que se descargo</strong>,' : '')
      + ' revisa que el mensaje tenga el asunto y contenido, y presiona el bot\u00f3n <strong>ENVIAR</strong> ah\u00ed mismo.'
      + '</div>'
      + '<button class="btn btn-green" id="btn-confirmado" style="margin-top:0;">Ya presion\u00e9 Enviar en mi correo</button>'
      + '<button class="btn" style="background:#e2e8f0;color:#0f172a;margin-top:8px;" id="btn-reintentar">Abrir mi app de correo de nuevo</button>'
      + '<div style="margin-top:16px;padding-top:16px;border-top:1px solid var(--border);text-align:left;">'
      + '<p style="font-size:11px;color:var(--muted);margin-bottom:6px;">\u00bfNo te abri\u00f3 ninguna app de correo? Copia este texto y env\u00edalo por WhatsApp o cualquier medio a <strong>contecadocs@gmail.com</strong>:</p>'
      + '<textarea readonly style="width:100%;min-height:100px;font-size:11px;font-family:var(--mono);background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:8px;" onclick="this.select()">' + escH(asunto + String.fromCharCode(10) + String.fromCharCode(10) + cuerpo) + '</textarea>'
      + '</div>'
      + '</div>';

    document.getElementById('btn-confirmado').addEventListener('click', function(){
      document.getElementById('main-content').innerHTML =
        '<div class="card" style="text-align:center;padding:40px 24px;">'
        + '<div style="font-size:64px;margin-bottom:14px;">\u2705</div>'
        + '<h2 style="font-size:22px;color:var(--green);margin-bottom:10px;">\u00a1Gracias!</h2>'
        + '<p style="color:var(--muted);font-size:14px;">El administrador cerrar\u00e1 el ticket ' + escH(tkt.num) + ' en el sistema.</p>'
        + '</div>';
    });
    document.getElementById('btn-reintentar').addEventListener('click', function(){
      window.location.href = mailto;
    });
  }, 800);
}

      <div style="font-size:14px;font-weight:700;margin-bottom:4px;">✍️ Sección del Cliente</div>
      <p style="font-size:12px;color:var(--muted);margin-bottom:8px;">Esta parte la completa y firma el cliente al recibir el trabajo.</p>

      <label>Calificación del Servicio</label>
      <div class="rb-group">
        <label class="rb-opt"><input type="radio" name="da-calif" value="A"> A: 100%</label>
        <label class="rb-opt"><input type="radio" name="da-calif" value="B"> B: 90-80%</label>

      <label>Posición / Cargo</label>
      <input type="text" id="da-recibe-cargo" placeholder="Cargo de quien recibe">

      <label>Firma del Cliente (Recibí Conforme) <span style="color:var(--red);">*</span></label>
      <canvas id="canvas-firma-da"></canvas>
      <button type="button" class="btn" style="background:#e2e8f0;color:#0f172a;width:auto;padding:7px 18px;margin-top:8px;font-size:13px;" onclick="limpiarFirmaDA()">Limpiar firma</button>
    </div>`;
}

function calcTotalGastosDA(){
  const ids=['da-g1-val','da-g2-val','da-g3-val','da-g4-val'];
  let total=0;
  ids.forEach(id=>{ const el=document.getElementById(id); if(el) total += parseFloat(el.value)||0; });
  const out=document.getElementById('da-total-gastos');
  if(out) out.textContent = total.toFixed(2);
}

function calcTotalHorasDA(){
  const h=parseFloat(document.getElementById('da-hh-hombres')?.value)||0;
  const t=parseFloat(document.getElementById('da-hh-horas')?.value)||0;
  const out=document.getElementById('da-hh-total');
  if(out) out.textContent = (h*t).toFixed(1);
}

// ── Firma del Documento de Aceptación (canvas separado) ─────────
let _drawDA=false,_ctxDA=null,_cvDA=null;
function initFirmaDocAceptacion(){
  _cvDA=document.getElementById('canvas-firma-da');
  if(!_cvDA) return;
  _cvDA.width=_cvDA.offsetWidth;
  _cvDA.height=130;
  _ctxDA=_cvDA.getContext('2d');
  _ctxDA.strokeStyle='#0f172a';_ctxDA.lineWidth=2.5;_ctxDA.lineCap='round';_ctxDA.lineJoin='round';
  function pos(e){
    const r=_cvDA.getBoundingClientRect();
    const t=e.touches?e.touches[0]:e;
    return{x:(t.clientX-r.left)*(_cvDA.width/r.width),y:(t.clientY-r.top)*(_cvDA.height/r.height)};
  }
  _cvDA.onmousedown=_cvDA.ontouchstart=e=>{_drawDA=true;const p=pos(e);_ctxDA.beginPath();_ctxDA.moveTo(p.x,p.y);e.preventDefault();};
  _cvDA.onmousemove=_cvDA.ontouchmove=e=>{if(!_drawDA)return;const p=pos(e);_ctxDA.lineTo(p.x,p.y);_ctxDA.stroke();e.preventDefault();};
  _cvDA.onmouseup=_cvDA.onmouseleave=_cvDA.ontouchend=_cvDA.ontouchcancel=()=>_drawDA=false;
}
function limpiarFirmaDA(){ if(_ctxDA&&_cvDA) _ctxDA.clearRect(0,0,_cvDA.width,_cvDA.height); }
function hayFirmaDA(){
  if(!_cvDA||!_ctxDA) return false;
  const d=_ctxDA.getImageData(0,0,_cvDA.width,_cvDA.height).data;
  for(let i=3;i<d.length;i+=4){ if(d[i]>0) return true; }
  return false;
}
function getFirmaDABase64(){ return hayFirmaDA() ? _cvDA.toDataURL('image/png') : null; }

// ── Construir y descargar el PDF del Documento de Aceptación ────
function generarPDFDocAceptacion(tkt){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({orientation:'portrait',unit:'mm',format:'letter'});
  const W=215.9, ml=13, mr=13, cw=W-ml-mr;
  const rightColW = cw*0.28;      // ancho columna de valores (derecha) en las tablas
  const leftColW  = cw-rightColW;  // ancho columna de descripción (izquierda)
  let y = 12;

  // ── Logo Puma Energy ──
  try{
    doc.addImage('data:image/png;base64,'+LOGO_PUMA_B64, 'PNG', ml, y+1, 32, 17.9);
  }catch(e){
    doc.setDrawColor(200,200,200);doc.rect(ml, y, 42, 16);
  }
  doc.setFontSize(7);doc.setTextColor(20,20,20);doc.setFont('helvetica','normal');
  doc.text('PEM-AD1', ml, y+21);

  // ── Título y número ──
  doc.setFont('helvetica','bold');doc.setFontSize(15);doc.setTextColor(20,20,20);
  doc.text('DOCUMENTO DE ACEPTACIÓN', ml+50, y+9);
  doc.setTextColor(180,30,30);doc.setFontSize(11);
  doc.text('N° '+(tkt.docAceptacionNum||'——————'), W-mr, y+9, {align:'right'});
  y += 24;

  doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(20,20,20);
  const contratista = document.getElementById('da-contratista')?.value || '';
  const lugar       = document.getElementById('da-lugar')?.value || '';
  const trabajos     = document.getElementById('da-trabajos')?.value || '';

  function lineaConDato(label, valor, yy){
    doc.text(label, ml, yy);
    const labelW = doc.getTextWidth(label);
    doc.setDrawColor(20,20,20);doc.setLineWidth(0.2);
    doc.line(ml+labelW+2, yy+0.8, W-mr, yy+0.8);
    if(valor) doc.text(valor, ml+labelW+4, yy);
  }
  lineaConDato('# de Ticket:', tkt.num||'', y); y+=8;
  lineaConDato('Nombre del contratista:', contratista, y); y+=8;
  lineaConDato('Lugar a realizar el trabajo:', lugar, y); y+=8;
  doc.text('Trabajos desarrollados:', ml, y);
  const twLabelW = doc.getTextWidth('Trabajos desarrollados:');
  const trabLines2 = doc.splitTextToSize(trabajos||'', cw-twLabelW-6);
  if(trabLines2[0]) doc.text(trabLines2[0], ml+twLabelW+4, y);
  doc.line(ml, y+2, W-mr, y+2);
  y += 8;
  if(trabLines2[1]) doc.text(trabLines2[1], ml+2, y);
  doc.line(ml, y+2, W-mr, y+2);
  y += 8;

  // ── DETALLES DE GASTOS A LLENAR POR EL CONTRATISTA ──
  const rh = 6.3;
  doc.setFillColor(15,15,15);
  doc.rect(ml, y, leftColW, 7, 'F');
  doc.rect(ml+leftColW, y, rightColW, 7, 'F');
  doc.setTextColor(255,255,255);doc.setFont('helvetica','bold');doc.setFontSize(8.5);
  doc.text('DETALLES DE GASTOS A LLENAR POR EL CONTRATISTA', ml+2, y+4.8);
  doc.text('VALOR (TIPO MONEDA)', ml+leftColW+2, y+4.8);
  y += 7;

  doc.setTextColor(20,20,20);doc.setFont('helvetica','normal');doc.setFontSize(8.5);
  doc.setDrawColor(150,150,150);doc.setLineWidth(0.2);

  const gastosRows = [
    ['Transporte', document.getElementById('da-g1-val')?.value, document.getElementById('da-g1-mon')?.value],
    ['Mano de obra', document.getElementById('da-g2-val')?.value, document.getElementById('da-g2-mon')?.value],
    ['Materiales', document.getElementById('da-g3-val')?.value, document.getElementById('da-g3-mon')?.value],
    [document.getElementById('da-g4-desc')?.value||'', document.getElementById('da-g4-val')?.value, document.getElementById('da-g4-mon')?.value],
    ['','','']
  ];
  gastosRows.forEach(([label,val,mon])=>{
    doc.rect(ml,y,leftColW,rh);
    doc.rect(ml+leftColW,y,rightColW,rh);
    doc.text(String(label||''), ml+2, y+4.4);
    if(val) doc.text((mon||'')+' '+parseFloat(val).toFixed(2), ml+leftColW+2, y+4.4);
    y+=rh;
  });
  doc.setFont('helvetica','bold');
  doc.rect(ml,y,leftColW,7);
  doc.rect(ml+leftColW,y,rightColW,7);
  doc.text('TOTAL', ml+2, y+4.8);
  doc.text(document.getElementById('da-total-gastos')?.textContent||'0.00', ml+leftColW+2, y+4.8);
  doc.setFont('helvetica','normal');
  y += 10;

  // ── HORAS HOMBRE TRABAJADAS ──
  doc.setFillColor(15,15,15);
  doc.rect(ml, y, cw, 6.5, 'F');
  doc.setTextColor(255,255,255);doc.setFont('helvetica','bold');doc.setFontSize(9);
  doc.text('HORAS HOMBRE TRABAJADAS', ml+cw/2, y+4.5, {align:'center'});
  y += 6.5;

  doc.setTextColor(20,20,20);doc.setFont('helvetica','normal');doc.setFontSize(8.5);
  const hhRows = [
    ['Cantidad de hombres', document.getElementById('da-hh-hombres')?.value||''],
    ['Cantidad de horas trabajadas', document.getElementById('da-hh-horas')?.value||''],
    ['Total de horas hombres trabajadas', document.getElementById('da-hh-total')?.textContent||'']
  ];
  hhRows.forEach(([label,val])=>{
    doc.rect(ml,y,leftColW,rh);
    doc.rect(ml+leftColW,y,rightColW,rh);
    doc.text(label, ml+2, y+4.4);
    if(val) doc.text(String(val), ml+leftColW+2, y+4.4);
    y+=rh;
  });

  // ── A LLENAR POR PUMA (sección administrativa — se completa después en oficina) ──
  doc.setFillColor(15,15,15);
  doc.rect(ml, y, cw, 6.5, 'F');
  doc.setTextColor(255,255,255);doc.setFont('helvetica','bold');doc.setFontSize(9);
  doc.text('A LLENAR POR PUMA', ml+cw/2, y+4.5, {align:'center'});
  y += 6.5;

  doc.setTextColor(20,20,20);doc.setFont('helvetica','normal');doc.setFontSize(8.5);
  doc.setDrawColor(150,150,150);

  doc.rect(ml,y,cw-rightColW/2,7); doc.rect(ml+cw-rightColW/2,y,rightColW/2,7);
  doc.text('Detalles de cargos:', ml+2, y+4.8);
  y+=7;

  doc.rect(ml,y,leftColW*0.35,6); doc.rect(ml+leftColW*0.35,y,cw-leftColW*0.35,6);
  doc.text('N° Cliente:', ml+2, y+4.2);
  doc.text('Nombre de E/S o Cliente', ml+leftColW*0.35+cw*0.25, y+4.2, {align:'center'});
  y+=6;

  doc.rect(ml,y,cw,11);
  doc.text('Observaciones:', ml+2, y+4.2);
  y+=11;

  doc.rect(ml,y,cw-rightColW,6); doc.rect(ml+cw-rightColW,y,rightColW,6);
  doc.text('% a pagar por E/S o cliente', ml+cw-rightColW-2, y+4.2, {align:'right'});
  y+=6;
  doc.rect(ml,y,cw-rightColW,6); doc.rect(ml+cw-rightColW,y,rightColW,6);
  doc.text('% a pagar por PUMA', ml+cw-rightColW-2, y+4.2, {align:'right'});
  y+=6;

  doc.setFont('helvetica','bold');doc.setFontSize(8);
  doc.rect(ml,y,cw,6);
  doc.text('Esta sección será llenada por el cliente únicamente', ml+2, y+4.2);
  y+=6;
  doc.setFont('helvetica','normal');doc.setFontSize(8.5);

  const coment = document.getElementById('da-comentarios')?.value || '';
  doc.rect(ml,y,cw,11);
  doc.text('Comentarios:', ml+2, y+4.2);
  if(coment){
    const cLines = doc.splitTextToSize(coment, cw-6);
    doc.text(cLines[0]||'', ml+2, y+8.5);
  }
  y+=11;

  // ── Calificación del servicio ──
  const calif = document.querySelector('input[name="da-calif"]:checked')?.value || '';
  doc.rect(ml,y,cw,7);
  doc.text('Calificación del servicio', ml+2, y+4.8);
  ['A','B','C'].forEach((letra,i)=>{
    const bx = ml+70+i*28;
    doc.rect(bx, y+1.5, 4, 4);
    if(calif===letra){ doc.setFont('helvetica','bold'); doc.text('X', bx+0.8, y+4.5); doc.setFont('helvetica','normal'); }
    doc.text(letra, bx+6, y+4.5);
  });
  y+=7;
  doc.setFontSize(7.5);doc.setTextColor(60,60,60);
  doc.rect(ml,y,cw,5.5);
  doc.text('A: 100%   B: 90% - 80%   C: 70% - 60%', ml+2, y+3.8);
  y+=5.5+4;

  // ── Lugar/Fecha, Nombre y Sello ──
  doc.setFontSize(8.5);doc.setTextColor(20,20,20);
  const fechaHoy = new Date().toLocaleDateString('es-HN');
  lineaConDato('Lugar y Fecha:', (tkt.estacion||'')+' — '+fechaHoy, y); y+=8;
  lineaConDato('Nombre y Sello de la Cía.:', '', y); y+=10;

  // ── Firma ──
  const nombreRecibe = document.getElementById('da-recibe-nombre')?.value || '';
  const cargoRecibe  = document.getElementById('da-recibe-cargo')?.value || '';
  const firmaB64 = getFirmaDABase64();
  const sig1X=ml, sig1W=90, sig2X=ml+110, sig2W=60;

  if(firmaB64){
    try{ doc.addImage(firmaB64, 'PNG', sig1X, y-14, 80, 16); }catch(e){}
  }
  doc.setDrawColor(20,20,20);doc.setLineWidth(0.3);
  doc.line(sig1X, y+2, sig1X+sig1W, y+2);
  doc.line(sig2X, y+2, sig2X+sig2W, y+2);
  doc.setFontSize(8);
  doc.text('Recibí Conforme:', ml, y-1);
  doc.setFontSize(7.5);doc.setTextColor(90,90,90);
  doc.text('Firma', sig1X+sig1W/2, y+6, {align:'center'});
  doc.text('Posición', sig2X+sig2W/2, y+6, {align:'center'});
  doc.setTextColor(20,20,20);doc.setFontSize(8);
  if(cargoRecibe) doc.text(cargoRecibe, sig2X+sig2W/2, y+1.5, {align:'center'});
  y += 12;

  lineaConDato('Nombre de la persona que firma:', nombreRecibe, y);
  y += 8;

  // ── Nota legal ──
  doc.setFont('helvetica','bold');doc.setFontSize(7.5);doc.setTextColor(20,20,20);
  const notaTxt = 'NOTA:  EL TRABAJO SOLO SE TOMARA EN CUENTA CUANDO LA FACTURA O RECIBO VENGAN ACOMPAÑADOS DE ESTE DOCUMENTO DEBIDAMENTE FIRMADO Y SELLADO POR EL CLIENTE.';
  const notaLines = doc.splitTextToSize(notaTxt, cw-10);
  doc.text(notaLines, ml+cw/2, y, {align:'center'});
  y += notaLines.length*3.6 + 4;

  // ── Pie: tipos de copia ──
  doc.setFont('helvetica','normal');doc.setFontSize(7);doc.setTextColor(90,90,90);
  doc.text('Original blanco: PUMA', ml, y);
  doc.text('Copia amarillo: Cliente', ml, y+4);
  doc.text('Copia Verde: Técnico / Contratista', ml, y+8);

  doc.setFontSize(7);doc.setTextColor(140,140,140);
  doc.text('Ticket relacionado: '+(tkt.num||'—'), W-mr, y+8, {align:'right'});

  return doc;
}
